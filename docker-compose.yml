
services:
  # PostgreSQL Database
  postgresdb:
    image: postgres:16-alpine
    container_name: school-transport-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: schooltransportdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schooltransportdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-transport-net

  # Spring Boot Backend
  backend:
    build:
      context: ./backend/CrudServiceProject
      dockerfile: Dockerfile
    image: docker-backend-2400033253:latest
    container_name: school-transport-backend
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/schooltransportdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: docker
    depends_on:
      postgresdb:
        condition: service_healthy
    restart: on-failure
    networks:
      - school-transport-net

  # React Frontend
  frontend:
    build:
      context: ./frontend/SchoolTransportFrontend
      dockerfile: Dockerfile
    image: docker-frontend-2400033253:latest
    container_name: school-transport-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - school-transport-net

volumes:
  postgres_data:

networks:
  school-transport-net:
    driver: bridge
